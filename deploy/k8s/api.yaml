apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: advanced-rag
spec:
  replicas: 1
  selector:
    matchLabels: {app: rag-api}
  template:
    metadata:
      labels: {app: rag-api}
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/advanced-rag-api:0.1.0
          ports: [{containerPort: 8000}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: rag-secrets, key: postgres-password}}
            - {name: DATABASE_URL, value: "postgresql+psycopg://raguser:$(POSTGRES_PASSWORD)@postgres:5432/ragdb"}
            - {name: CHROMA_PATH, value: /data/chroma}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: rag-secrets, key: jwt-secret}}
            - name: GROQ_API_KEY
              valueFrom: {secretKeyRef: {name: rag-secrets, key: groq-api-key}}
          volumeMounts:
            - {name: chroma-data, mountPath: /data/chroma}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "4Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: chroma-data
          persistentVolumeClaim: {claimName: chroma-pvc}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-pvc
  namespace: advanced-rag
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: advanced-rag
spec:
  selector: {app: rag-api}
  ports: [{port: 8000, targetPort: 8000}]
